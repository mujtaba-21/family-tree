name: Build

# A push to main updates the web version only (the pages job).
# The Android APK is built, checked on emulators and released only when the workflow is started by hand
# (Actions → Build → Run workflow).
on:
  push:
    branches: [main]
    paths: ["web/**", "tools/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        working-directory: android-shell
        run: npm install --no-audit --no-fund

      - name: Copy the web app into the shell
        run: |
          rm -rf android-shell/www
          cp -r web android-shell/www
          rm -f android-shell/www/sw.js

      - name: Create the Android project
        working-directory: android-shell
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch (no internet permission, no cloud backup, name, icons, version)
        run: bash android-shell/patch.sh

      - name: Build release
        working-directory: android-shell/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Sign
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            PASS="$KEYSTORE_PASS"
          elif [ -f android-shell/signing/release.jks ]; then
            cp android-shell/signing/release.jks release.jks
            PASS="$(cat android-shell/signing/password.txt)"
          else
            echo "No signing key: refusing to build an APK that could not be updated later." >&2
            exit 1
          fi
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          IN=android-shell/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" aligned.apk
          "$BT/apksigner" sign --ks release.jks --ks-key-alias shajara --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out shajara.apk aligned.apk
          "$BT/apksigner" verify --print-certs shajara.apk
          ("$BT/aapt" dump permissions shajara.apk || "$BT/aapt2" dump permissions shajara.apk) | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then echo "INTERNET permission present" >&2; exit 1; fi
          rm -f release.jks

      - uses: actions/upload-artifact@v4
        with:
          name: shajara-apk
          path: shajara.apk

      # The same app with WebView debugging switched on and debug signing. Only the checks below use it.
      - name: Test build
        working-directory: android-shell/android
        run: |
          python3 - <<'PY'
          import json
          p = "app/src/main/assets/capacitor.config.json"
          c = json.load(open(p, encoding="utf-8"))
          c.setdefault("android", {})["webContentsDebuggingEnabled"] = True
          json.dump(c, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../shajara-test.apk

      - uses: actions/upload-artifact@v4
        with:
          name: shajara-test-apk
          path: shajara-test.apk

  # Android 14 and 15 emulators: the release APK must start, and the walk-through (tests/android) must pass.
  # Screenshots and logs are kept on the branches test-results-android-14 / -15.
  check:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            android: 14
          - api: 35
            android: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: shajara-apk
          path: rel

      - uses: actions/download-artifact@v4
        with:
          name: shajara-test-apk
          path: test

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test tools
        working-directory: tests/android
        run: npm install --no-audit --no-fund

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash tests/android/run.sh

      - name: Keep the screenshots and logs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d tests/android/out ] || exit 0
          cd tests/android/out
          git init -q -b results
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Android ${{ matrix.android }}, run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" results:test-results-android-${{ matrix.android }}

  # Published only after both checks pass.
  release:
    needs: [build, check]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: shajara-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "شجرة العائلة 1.0.${{ github.run_number }}"
          body: "ملف التثبيت للأندرويد: shajara.apk"
          files: shajara.apk
          make_latest: true

  # Publishes the web/iPhone version on GitHub Pages (gh-pages branch).
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_web.py dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
