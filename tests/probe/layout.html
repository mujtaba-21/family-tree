<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/app.css"></head><body>
<script type="module">
import * as M from "../js/model.js";
import { layoutTree } from "../js/tree/layout.js";
import { measure, fontsReady } from "../js/tree/measure.js";
await fontsReady();
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const NAMES_M = ["محمد","علي","حسن","حسين","عبدالله","موسى","جعفر","صالح","سعد","يوسف","إبراهيم","عيسى","مهدي","كاظم"];
const NAMES_F = ["فاطمة","زينب","مريم","خديجة","سكينة","رقية","ليلى","نورة","هدى","سارة"];
function make(depth, branch, wifeP = 0.8) {
  const f = M.createFamily({ familyName: "تجربة", root: { name: "الجد", gender: "m", fam: "التجربة" } });
  let gen = [f.rootId];
  for (let g = 1; g <= depth; g++) {
    const next = [];
    for (const pid of gen) {
      const p = f.persons[pid];
      if (p.gender !== "m" && rnd() > 0.3) continue;
      const n = Math.round(branch(g) * (0.5 + rnd()));
      if (!n) continue;
      let u;
      if (rnd() < wifeP) { u = M.addSpouse(f, pid, { name: p.gender === "m" ? NAMES_F[Math.floor(rnd()*10)] : NAMES_M[Math.floor(rnd()*14)], fam: "الغريب" }); }
      else u = M.unknownSpouseUnion(f, pid, true);
      const rows = [];
      for (let i = 0; i < n; i++) { const m = rnd() < 0.55; rows.push({ name: m ? NAMES_M[Math.floor(rnd()*14)] : NAMES_F[Math.floor(rnd()*10)], gender: m ? "m" : "f" }); }
      next.push(...M.addChildren(f, u.id, rows));
    }
    gen = next;
  }
  return f;
}
const fams = {
  g2: make(1, () => 10),
  g3: make(2, () => 4),
  g4: make(3, (g) => [0, 5, 4, 3][g]),
  g5: make(4, (g) => [0, 5, 4, 3, 2.5][g]),
  g6: make(5, (g) => [0, 4, 3.5, 3, 2.5, 2][g]),
  g8: make(7, (g) => [0, 3, 3, 2.6, 2.4, 2.2, 2, 1.8][g]),
};
const out = {};
for (const [k, f] of Object.entries(fams)) {
  const n = Object.keys(f.persons).length;
  let maxGen = 0; for (const id of Object.keys(f.persons)) if (M.isDesc(f, id)) maxGen = Math.max(maxGen, M.genOf(f, id));
  const rows = [];
  for (let L = 1; L <= maxGen + 1; L++) {
    const sc = layoutTree(f, { forceL: L }, measure);
    rows.push({ L, w: Math.round(sc.bbox.w), h: Math.round(sc.bbox.h), r: +(sc.bbox.w / sc.bbox.h).toFixed(2) });
  }
  out[k] = { n, maxGen, rows };
}
window.__out = out;
document.title = "done";
</script></body></html>
